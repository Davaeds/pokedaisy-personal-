org.gradle.jvmargs=-Xmx4g
# The Kotlin compiler runs in its own daemon, which otherwise inherits Gradle's heap: a full compile of the app ran
# out of 3 GB (Compose's IR lowering) on CI's 16 GB runners.
kotlin.daemon.jvmargs=-Xmx6g
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# NDK 28 is newer than AGP 8.5.2's tested range; silence the warning-to-error path.
android.suppressUnsupportedCompileSdk=34

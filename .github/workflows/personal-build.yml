# Personal build of this fork: the upstream app plus this fork's own changes, as a separate app
# ("PokeDaisy Plus", com.pokedaisy.ethan) that installs next to the official one.
#
# Runs on every push to main (a "Sync fork" with upstream counts) and by hand (Actions > Personal build >
# Run workflow). It renames the app only inside the build (the source files keep upstream's names, so syncs stay
# clean), builds a signed release APK and publishes it as this fork's release v<versionName>, which the in-app
# updater (pointed at this fork in the build) offers.
#
# One secret is needed: PERSONAL_KEYSTORE_BASE64 (Settings > Secrets and variables > Actions), a base64 of this
# fork's own signing key. Every build must be signed with the same key, or an update won't install over the last one.
# Without it the build still runs (a compile check) but publishes nothing.
name: Personal build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: personal-build
  cancel-in-progress: true

env:
  APP_ID: com.pokedaisy.ethan
  APP_NAME: PokeDaisy Plus
  # The key file itself is the secret; its password only unlocks the file.
  KEY_PASSWORD: pokedaisy-personal
  KEY_ALIAS: personal

jobs:
  build:
    if: github.repository != 'lidor30/pokedaisy'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: NDK + CMake
        run: sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Make it this fork's app (build only, not committed)
        run: |
          set -euo pipefail
          sed -i "s/applicationId = \"com.pokedaisy.app\"/applicationId = \"${APP_ID}\"/" app/build.gradle.kts
          grep -q "applicationId = \"${APP_ID}\"" app/build.gradle.kts
          sed -i "s|<string name=\"app_name\">PokeDaisy</string>|<string name=\"app_name\">${APP_NAME}</string>|" app/src/main/res/values/strings.xml
          grep -q "${APP_NAME}" app/src/main/res/values/strings.xml
          sed -i "s|const val REPO = \"lidor30/pokedaisy\"|const val REPO = \"${GITHUB_REPOSITORY}\"|" app/src/main/kotlin/com/pokedaisy/app/AppUpdater.kt
          grep -q "${GITHUB_REPOSITORY}" app/src/main/kotlin/com/pokedaisy/app/AppUpdater.kt
          echo "VERSION=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)" >> "$GITHUB_ENV"

      - name: Signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.PERSONAL_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::warning::PERSONAL_KEYSTORE_BASE64 isn't set: building to check it compiles, nothing is published"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/personal.jks"
          {
            echo "storeFile=${RUNNER_TEMP}/personal.jks"
            echo "storePassword=${KEY_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > keystore.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          if [ "${{ steps.key.outputs.signed }}" = "true" ]; then
            ./gradlew :app:assembleRelease --stacktrace
          else
            ./gradlew :app:assembleDebug --stacktrace
          fi

      - name: Publish the release
        if: steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          apk="PokeDaisy-Plus-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "${apk}"
          notes="PokeDaisy ${VERSION} by Lidor Itzhari (https://github.com/lidor30/pokedaisy), plus this fork's changes. Built from ${GITHUB_SHA}."
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${apk}" --clobber
            gh release edit "${tag}" --notes "${notes}"
          else
            gh release create "${tag}" "${apk}" --title "PokeDaisy Plus ${VERSION}" --notes "${notes}" --target "${GITHUB_SHA}"
          fi

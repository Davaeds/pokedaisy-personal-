# FireRed / LeafGreen's card (trainer_card.c's SetPlayerCardData, include/global.h): game stats in
# SaveBlock1, the National Dex magic at SaveBlock2 + 0x18 + 3, the Sticker Man's var.
[record.TRAINER_CARD_FIRERED]
schema = 'gen3_card'
style = 'CardStyle.KANTO'
gameStatsOff = 0x1200
flagsOff = 0xEE0
varsOff = 0x1000
badgeFlag = 0x820
pokedexFlag = 0x829
nationalMagicOff = 0x1B  # 0x18 + 3
nationalMagic = 0xB9
nationalVar = 0x404E
nationalVarValue = 0x6258
nationalFlag = 0x840
dexFlags = 'FIRERED_DEX_FLAGS'
regionalDex = { kotlin = 'IntArray(151) { it + 1 }' }
stickerVar = 0x4049


# The 3DS port's companion (3ds/core/, also the Linux host's): which configs it gets and where each
# field of its struct pd_config (3ds/core/pd_game.h) comes from. scripts/gen_gamedata.py writes them
# to 3ds/core/pd_configs_gen.h; pd_game.c picks one by the ROM header. The format: gamedata/README.md.

output = '3ds/core/pd_configs_gen.h'
struct = 'pd_config'
prefix = 'PD_CONFIG_'

# Kotlin names a value may hold (refs, list items) -> the C the port uses for them.
[names]
POCKET_ITEMS = 'PD_POCKET_ITEMS'
POCKET_POKE_BALLS = 'PD_POCKET_BALLS'
POCKET_TM_HM = 'PD_POCKET_TMHM'
POCKET_BERRIES = 'PD_POCKET_BERRIES'
POCKET_KEY_ITEMS = 'PD_POCKET_KEY'

[names.CardStyle]
KANTO = 'PD_CARD_KANTO'
HOENN = 'PD_CARD_HOENN'

# Each part is a set of pd_config fields = a path into the config: a field, then (through a record
# the field names) that record's field, a list's index. A record a config doesn't have counts as its
# schema's defaults, so the save offsets below come out right for a game without a POKéDEX; `none`
# is the value that means "not in this game" there, written as 0 (the port's "unknown").

# The RAM globals and the save offsets every tab reads.
[part.ram]
playerParty = 'playerParty'
playerPartyCount = 'playerPartyCount'
battleMons = 'battleMons'
battlerPositions = 'battlerPositions'
battlersCount = 'battlersCount'
battleTypeFlags = 'battleTypeFlags'
gMain = 'gMain'
saveBlock1Ptr = 'saveBlock1Ptr'
saveBlock2Ptr = 'saveBlock2Ptr'
mapHeader = 'mapHeader'
encryptionKeyOff = 'encryptionKeyOff'
moneyOff = 'moneyOff'
bagPockets = 'bagPockets'
bagOrder = 'bagPocketOrder'
dexSeenCopy1 = 'pokedex.flags.seenCopies.0'
dexSeenCopy2 = 'pokedex.flags.seenCopies.1'
nationalMagicOff = 'pokedex.nationalMagicOff'
nationalMagic = 'pokedex.nationalMagic'
flagsOff = 'guideTables.sb1FlagsOff'
varsOff = 'guideTables.sb1VarsOff'
flagBytes = 'guideTables.flagBytes'

# The battle's FOE TEAM.
[part.foes]
enemyParty = 'enemyParty'
battlerPartyIndexes = 'battlerPartyIndexes'
battleStructPtr = 'battleStructPtr'
monToSwitchIntoOff = 'monToSwitchIntoOff'

# The party menu's icons.
[part.icons]
monIconTable = 'monIconTable'
monIconPaletteIndices = 'monIconPaletteIndices'
monIconPaletteTable = 'monIconPaletteTable'

# POKéDEX.
[part.dex]
dexEntries = 'pokedex.entries'
dexEntryStride = 'pokedex.entryStride'
speciesInfo = 'pokedex.speciesInfo'
speciesToNational = 'pokedex.speciesToNational'
abilityNames = 'pokedex.abilityNames'
frontPics = 'pokedex.frontPics'
palettes = 'pokedex.palettes'
regionalOrder = 'pokedex.regionalOrder'
regionalCount = 'pokedex.regionalCount'
regionName = 'pokedex.regionName'

# GUIDE's live pages.
[part.guide]
trainers = 'guideTables.trainers'
learnsets = 'guideTables.learnsets'
wildHeaders = 'guideTables.wildHeaders'
probeTrainer = 'guideTables.probeTrainer'
probeName = 'guideTables.probeName'

# TRAINER CARD.
[part.card]
cardStyle = 'trainerCard.style'
gameStatsOff = 'trainerCard.gameStatsOff'
badgeFlag = 'trainerCard.badgeFlag'
pokedexFlag = 'trainerCard.pokedexFlag'
nationalVar = 'trainerCard.nationalVar'
nationalVarValue = 'trainerCard.nationalVarValue'
nationalFlag = 'trainerCard.nationalFlag'
stickerVar = { path = 'trainerCard.stickerVar', none = -1 }
frontierSymbolFlag = { path = 'trainerCard.frontierSymbolFlag', none = -1 }
museumWinnersOff = { path = 'trainerCard.museumWinnersOff', none = -1 }
frontierBpOff = { path = 'trainerCard.frontierBpOff', none = -1 }

# FLY: from the config's `fly` record (its `records`, `@fly.`): the app's FlyFns and its HealWarp.
[part.fly]
flyFlagGet = '@fly.flagGet'
flySetUp = '@fly.setUpFieldMoveFly'
flyGetMapsecType = '@fly.getMapsecType'
flyFade = '@fly.fadeScreen'
flyLock = '@fly.lockControls'
flyUnlock = '@fly.unlockControls'
flyWarp = '@fly.setFlyWarpDestination'
flyBadgeFlag = '@fly.badgeFlag'
flyPartySlot = '@fly.partyMenuSlotId'
flyDestinations = '@fly.destinations'
flyFirstMapsec = '@fly.firstMapsec'
flyCount = '@fly.count'
flyCrcs = '@fly.codeCrcs'
flyTypes = '@fly.flyTypes'
flyExtra = '@fly.extraMapsecs'
flyHealTo = '@fly.healWarp.toHealLocation'
flyMapWarp = '@fly.healWarp.toMapWarp'
flyReturn = '@fly.healWarp.returnToField'
flySaveBlock2Ptr = '@fly.healWarp.saveBlock2Ptr'
flySpecial = '@fly.healWarp.special'
flyGenderMapsec = '@fly.healWarp.genderMapsec'
flyMaleHeal = '@fly.healWarp.maleHeal'
flyFemaleHeal = '@fly.healWarp.femaleHeal'

# The configs, each with the parts the port reads for it so far (`name` is the C's: PD_CONFIG_<name>) and the
# records `@name.` paths start from (`records`).
# FireRed rev 0 and LeafGreen: the tabs that read RAM (and the MAP, whose art is found by fingerprint)
# and the party icons; their POKéDEX and GUIDE tables aren't ported yet. The FOE TEAM's addresses
# are known for rev 1 only.
[config.firered_rev1]
name = 'FIRERED_REV1'
parts = ['ram', 'foes', 'icons', 'dex', 'guide', 'card', 'fly']
records = { fly = 'FLY_FIRERED_REV1' }

[config.firered_rev0]
name = 'FIRERED_REV0'
parts = ['ram', 'icons']

[config.leafgreen_rev0]
name = 'LEAFGREEN_REV0'
parts = ['ram', 'icons', 'card', 'fly']
records = { fly = 'FLY_LEAFGREEN_REV0' }

[config.leafgreen_rev1]
name = 'LEAFGREEN_REV1'
parts = ['ram', 'foes', 'icons', 'card', 'fly']
records = { fly = 'FLY_LEAFGREEN_REV1' }

[config.emerald_retail]
name = 'EMERALD'
parts = ['ram', 'foes', 'icons', 'dex', 'guide', 'card', 'fly']
records = { fly = 'FLY_EMERALD' }
